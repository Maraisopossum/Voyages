<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Voyages</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap">
<style>
:root{--paper:#f1f2f3;--panel:#fff;--ink:#141517;--muted:#4c5257;--mad:#b3122a}
@media (prefers-color-scheme:dark){:root{--paper:#0f1113;--panel:#171a1d;--ink:#eef0f1;--muted:#a6adb2;--mad:#ff6b7d;color-scheme:dark}}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 'Barlow',Arial,sans-serif}
main{max-width:44rem;margin:0 auto;padding:2.5rem max(16px,env(safe-area-inset-left)) 3rem}
h1{font:700 3.2rem/1 'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;margin:0 0 1.5rem;border-bottom:6px solid var(--ink);padding-bottom:.4rem}
a.trip{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:center;background:var(--panel);border:2px solid var(--ink);padding:.9rem 1rem;color:inherit;text-decoration:none;margin:.7rem 0}
a.trip:hover{outline:3px solid var(--mad)}
.tag{font:700 1.4rem 'Barlow Condensed',sans-serif;text-transform:uppercase;color:#fff;background:var(--mad);padding:.3rem .7rem}
.trip b{font:700 1.4rem 'Barlow Condensed',sans-serif;display:block}
.trip span{color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<main>
<h1>Voyages</h1>
<a class="trip" href="madrid/"><span class="tag">Madrid</span><span><b>Madrid à pied</b><span>26 → 30 décembre 2026 · à six, tout à pied</span></span></a>
</main>
</body>
</html>
